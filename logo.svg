<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 60" fill="none">
  <!-- Background -->
  <defs>
    <linearGradient id="logoGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1a2e;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0f3460;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="accentGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#e94560;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#c73e54;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Icon Part -->
  <g transform="translate(10, 5)">
    <!-- Gear/Production Icon -->
    <circle cx="22" cy="25" r="20" fill="url(#logoGradient)"/>
    <circle cx="22" cy="25" r="16" fill="none" stroke="white" stroke-width="2"/>
    
    <!-- Gear Teeth -->
    <path d="M22 5 L22 10" stroke="white" stroke-width="4" stroke-linecap="round"/>
    <path d="M22 40 L22 45" stroke="white" stroke-width="4" stroke-linecap="round"/>
    <path d="M5 25 L10 25" stroke="white" stroke-width="4" stroke-linecap="round"/>
    <path d="M34 25 L39 25" stroke="white" stroke-width="4" stroke-linecap="round"/>
    
    <!-- Inner Circle -->
    <circle cx="22" cy="25" r="10" fill="white"/>
    <circle cx="22" cy="25" r="6" fill="url(#accentGradient)"/>
    
    <!-- Metal Bars -->
    <rect x="8" y="22" width="6" height="6" rx="1" fill="url(#logoGradient)" transform="rotate(45 11 25)"/>
    <rect x="28" y="22" width="6" height="6" rx="1" fill="url(#logoGradient)" transform="rotate(45 31 25)"/>
  </g>
  
  <!-- Text Part -->
  <g transform="translate(65, 38)">
    <!-- Company Name -->
    <text font-family="Arial, sans-serif" font-size="22" font-weight="bold" fill="#1a1a2e">
      <tspan>Промтех</tspan>
      <tspan fill="#e94560">ресурс</tspan>
    </text>
  </g>
  
  <!-- Tagline -->
  <text x="65" y="52" font-family="Arial, sans-serif" font-size="8" fill="#8892a0" letter-spacing="2">
    ОПТОВАЯ ТОРГОВЛЯ МЕТАЛЛАМИ
  </text>
</svg>